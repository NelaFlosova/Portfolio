<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Portfolio</title>
    <script>
        // Immediately apply theme before page renders to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <script src="projects-data.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="theme.js"></script>
    <style>
        /* Animation & Interaction Styles Only */

        /* Bounce animation for scroll arrow */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(20px); }
        }

        .hero-scroll-arrow {
            animation: bounce 2s ease-in-out infinite;
        }

        /* Hidden state for filtered projects */
        .project-card.hidden {
            display: none;
        }

        /* Hover transitions */
        .project-card {
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-10px);
        }

        .project-arrow {
            opacity: 0;
            width: 0;
            margin-right: 0;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        margin-right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:hover .project-arrow {
            opacity: 1;
            width: clamp(24px, 2.5vw, 32px);
            margin-right: 8px;
        }

        .project-title-text {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:hover .project-title-text {
            transform: translateX(5px);
        }

        .project-image img {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:hover .project-image img {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="nav-left">
                <div class="nav-logo-icon">NF</div>
                <div class="nav-logo-text">Nela Flosova</div>
            </div>
            <div class="nav-right">
                <!-- Theme toggle hidden for now
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10 2V4M10 16V18M18 10H16M4 10H2M15.657 4.343L14.243 5.757M5.757 14.243L4.343 15.657M15.657 15.657L14.243 14.243M5.757 5.757L4.343 4.343" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                -->
                <a href="about.html" class="nav-button primary">Let's Talk <span>•</span></a>
                <div class="menu-wrapper">
                    <button class="nav-button menu-toggle menu-icon-only" aria-label="Menu">☰</button>
                    <div class="menu-dropdown">
                        <a href="index.html">Work</a>
                        <a href="about.html">About</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <script>
        // Menu toggle functionality
        document.addEventListener('DOMContentLoaded', function () {
            const menuToggle = document.querySelector('.menu-toggle');
            const menuWrapper = document.querySelector('.menu-wrapper');

            menuToggle.addEventListener('click', function (e) {
                e.stopPropagation();
                menuWrapper.classList.toggle('active');
            });

            // Close menu when clicking outside
            document.addEventListener('click', function (e) {
                if (!menuWrapper.contains(e.target)) {
                    menuWrapper.classList.remove('active');
                }
            });

            // Close menu when clicking a link
            const menuLinks = document.querySelectorAll('.menu-dropdown a');
            menuLinks.forEach(link => {
                link.addEventListener('click', function () {
                    menuWrapper.classList.remove('active');
                });
            });
        });
    </script>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-title-wrapper">
            <h1 class="hero-title">SELECTED WORK</h1>
            <div class="hero-right">
                <div class="project-count">0</div>
                <div class="hero-scroll-arrow">↘</div>
            </div>
        </div>
    </section>

    <!-- Projects Grid -->
    <section class="projects-container">
        <!-- Filter Buttons -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">all</button>
            <button class="filter-btn" data-filter="3d">3d & render</button>
            <button class="filter-btn" data-filter="game">game design</button>
            <button class="filter-btn" data-filter="ui-ux">ui/ux</button>
            <button class="filter-btn" data-filter="graphics">graphics</button>
        </div>

        <div class="projects-grid" id="projectsGrid">
            <!-- Projects will be dynamically inserted here -->
        </div>
    </section>

    <script>
        // Function to render projects
        function renderProjects() {
            const projectsGrid = document.getElementById('projectsGrid');
            const projectCountEl = document.querySelector('.project-count');

            projectsGrid.innerHTML = projectsData.map(project => {
                const categoriesStr = project.categories.join(' ');
                const tagsStr = project.tags.join(' • ');
                const imageHTML = project.image
                    ? `<img src="${project.image}" alt="${project.title}">`
                    : '';

                return `
                    <a href="${project.url}" ${project.url.startsWith('http') ? 'target="_blank"' : ''} class="project-card" data-category="${categoriesStr}">
                        <div class="project-image">
                            ${imageHTML}
                        </div>
                        <div class="project-tags">${tagsStr}</div>
                        <h2 class="project-title">
                            <span class="project-arrow">→</span>
                            <span class="project-title-text">${project.title}</span>
                        </h2>
                    </a>
                `;
            }).join('');

            // Update project count
            projectCountEl.textContent = projectsData.length;
        }

        // Render projects on page load
        renderProjects();

        gsap.registerPlugin(ScrollTrigger);

        // Animate hero elements on load
        gsap.from('.hero-title', {
            opacity: 0,
            y: 50,
            duration: 1,
            ease: 'power3.out'
        });

        gsap.from('.project-count', {
            opacity: 0,
            scale: 0.5,
            duration: 0.8,
            delay: 0.3,
            ease: 'back.out(1.7)'
        });

        gsap.from('.hero-scroll-arrow', {
            opacity: 0,
            duration: 0.8,
            delay: 0.5,
            ease: 'power2.out'
        });

        // Animate project cards on scroll
        gsap.utils.toArray('.project-card').forEach((card, index) => {
            gsap.from(card, {
                scrollTrigger: {
                    trigger: card,
                    start: 'top 80%',
                    end: 'top 50%',
                    toggleActions: 'play none none none'
                },
                opacity: 0,
                y: 60,
                duration: 0.8,
                delay: index * 0.2,
                ease: 'power3.out'
            });
        });

        // Smooth scroll for arrow
        document.querySelector('.hero-scroll-arrow').addEventListener('click', () => {
            gsap.to(window, {
                scrollTo: '.projects-container',
                duration: 1,
                ease: 'power2.inOut'
            });
        });

        // Project filtering system
        const filterBtns = document.querySelectorAll('.filter-btn');
        const projectCards = document.querySelectorAll('.project-card');
        const projectCountEl = document.querySelector('.project-count');
        const allBtn = document.querySelector('[data-filter="all"]');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.dataset.filter;

                if (filter === 'all') {
                    // "All" button - deselect all others
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                } else {
                    // Category button - toggle active state
                    btn.classList.toggle('active');
                    // Deactivate "all" if any category is selected
                    allBtn.classList.remove('active');

                    // If no categories selected, activate "all"
                    const hasActiveCategories = Array.from(filterBtns)
                        .some(b => b.dataset.filter !== 'all' && b.classList.contains('active'));
                    if (!hasActiveCategories) {
                        allBtn.classList.add('active');
                    }
                }

                // Get all active filters (excluding "all")
                const activeFilters = Array.from(filterBtns)
                    .filter(b => b.classList.contains('active') && b.dataset.filter !== 'all')
                    .map(b => b.dataset.filter);

                // Filter projects
                let visibleCount = 0;
                document.querySelectorAll('.project-card').forEach(card => {
                    const categories = card.dataset.category;

                    // Show if "all" is active OR if card matches any active filter
                    if (allBtn.classList.contains('active') ||
                        activeFilters.some(filter => categories.includes(filter))) {
                        card.classList.remove('hidden');
                        visibleCount++;
                    } else {
                        card.classList.add('hidden');
                    }
                });

                // Update project count
                projectCountEl.textContent = visibleCount;
            });
        });
    </script>
</body>
</html>
