<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: #e8e8e8;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 0;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 120px 60px 80px;
            position: relative;
        }

        .hero-title-wrapper {
            position: relative;
            width: 100%;
        }

        .hero-title {
            font-size: clamp(80px, 12vw, 200px);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 0.9;
            color: #1a1a1a;
            width: 100%;
        }

        .hero-right {
            position: absolute;
            top: 20px;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 20px;
        }

        .project-count {
            font-size: clamp(40px, 6vw, 80px);
            font-weight: 400;
            color: #1a1a1a;
            line-height: 1;
        }

        .scroll-arrow {
            font-size: clamp(60px, 10vw, 120px);
            color: #1a1a1a;
            line-height: 1;
            animation: bounce 2s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(20px); }
        }

        /* Projects Grid */
        .projects-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 60px;
        }

        /* Filter Buttons */
        .filter-container {
            margin-bottom: 60px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            background-color: transparent;
            border: 1px solid #d1d1d1;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: lowercase;
        }

        .filter-btn:hover {
            color: #1a1a1a;
            border-color: #1a1a1a;
        }

        .filter-btn.active {
            color: #f5f5f5;
            background-color: #1a1a1a;
            border-color: #1a1a1a;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px;
        }

        .project-card.hidden {
            display: none;
        }

        /* Project Card */
        .project-card {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-10px);
        }

        .project-tags {
            font-size: 12px;
            font-weight: 400;
            color: #666;
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }

        .project-title {
            font-size: clamp(32px, 4vw, 56px);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
            color: #1a1a1a;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:hover .project-title {
            transform: translateX(50px);
        }

        .project-arrow {
            font-size: clamp(28px, 3vw, 40px);
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-right: -8px;
        }

        .project-card:hover .project-arrow {
            opacity: 1;
        }

        .project-title .word {
            display: inline-flex;
            overflow: hidden;
        }

        .project-title .letter {
            display: inline-block;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:hover .project-title .letter {
            transform: translateY(-5px);
        }

        .project-title .letter:nth-child(even) {
            transition-delay: 0.05s;
        }

        .project-image {
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: #c8c8c8;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:hover .project-image img {
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 80px;
            }

            .hero-section {
                padding: 100px 40px 60px;
            }

            .projects-container {
                padding: 60px 40px;
            }
        }

        @media (max-width: 768px) {
            .hero-title-wrapper {
                gap: 30px;
            }

            .hero-right {
                gap: 15px;
                padding-top: 10px;
            }

            .hero-section {
                padding: 80px 24px 40px;
            }

            .projects-container {
                padding: 40px 24px;
            }

            .projects-grid {
                gap: 60px;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #f5f5f5;
            }

            .hero-title,
            .project-count,
            .scroll-arrow,
            .project-title {
                color: #f5f5f5;
            }

            .project-tags {
                color: #999;
            }

            .project-image {
                background-color: #2a2a2a;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="nav-left">
                <div class="nav-logo-icon">NF</div>
                <div class="nav-logo-text">Nela Flosova</div>
            </div>
            <div class="nav-right">
                <a href="about.html" class="nav-button primary">Let's Talk <span>•</span></a>
                <div class="menu-wrapper">
                    <button class="nav-button menu-toggle">Menu <span class="menu-dots">••</span></button>
                    <div class="menu-dropdown">
                        <a href="index.html">Work</a>
                        <a href="about.html">About</a>
                        <a href="for_fellas.html">For Fellas</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <script>
        // Menu toggle functionality
        document.addEventListener('DOMContentLoaded', function () {
            const menuToggle = document.querySelector('.menu-toggle');
            const menuWrapper = document.querySelector('.menu-wrapper');

            menuToggle.addEventListener('click', function (e) {
                e.stopPropagation();
                menuWrapper.classList.toggle('active');
            });

            // Close menu when clicking outside
            document.addEventListener('click', function (e) {
                if (!menuWrapper.contains(e.target)) {
                    menuWrapper.classList.remove('active');
                }
            });

            // Close menu when clicking a link
            const menuLinks = document.querySelectorAll('.menu-dropdown a');
            menuLinks.forEach(link => {
                link.addEventListener('click', function () {
                    menuWrapper.classList.remove('active');
                });
            });
        });
    </script>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-title-wrapper">
            <h1 class="hero-title">PROJECTS</h1>
            <div class="hero-right">
                <div class="project-count">2</div>
                <div class="scroll-arrow">↘</div>
            </div>
        </div>
    </section>

    <!-- Projects Grid -->
    <section class="projects-container">
        <!-- Filter Buttons -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">all</button>
            <button class="filter-btn" data-filter="3d">3d & render</button>
            <button class="filter-btn" data-filter="game">game design</button>
            <button class="filter-btn" data-filter="ui-ux">ui/ux</button>
            <button class="filter-btn" data-filter="web">web development</button>
            <button class="filter-btn" data-filter="graphics">graphics</button>
        </div>

        <div class="projects-grid">
            <!-- Project 1 -->
            <a href="https://nela-flosova.itch.io/secret-forest" target="_blank" class="project-card" data-category="3d game">
                <div class="project-image">
                    <!-- <img src="game.jpg" alt="3D Unity Game"> -->
                </div>
                <div class="project-tags">unity • 3d modeling • c# • animation</div>
                <h2 class="project-title">
                    <span class="project-arrow">→</span>
                    <span class="word">
                        <span class="letter">3</span><span class="letter">D</span>
                    </span>
                    <span class="word">
                        <span class="letter">U</span><span class="letter">n</span><span class="letter">i</span><span class="letter">t</span><span class="letter">y</span>
                    </span>
                    <span class="word">
                        <span class="letter">g</span><span class="letter">a</span><span class="letter">m</span><span class="letter">e</span>
                    </span>
                </h2>
            </a>

            <!-- Project 2 -->
            <a href="https://www.figma.com/proto/g9afPdbgVOH1twB0NP6P77/3D-iPhone-product-render?page-id=0%3A1&node-id=1-5&node-type=frame&viewport=-24%2C-38%2C0.09&t=jXDREYavExV5v32k-1&scaling=contain&content-scaling=fixed" target="_blank" class="project-card" data-category="3d">
                <div class="project-image">
                    <!-- <img src="iphone.jpg" alt="iPhone render"> -->
                </div>
                <div class="project-tags">3d modeling • product</div>
                <h2 class="project-title">
                    <span class="project-arrow">→</span>
                    <span class="word">
                        <span class="letter">P</span><span class="letter">r</span><span class="letter">o</span><span class="letter">d</span><span class="letter">u</span><span class="letter">c</span><span class="letter">t</span>
                    </span>
                    <span class="word">
                        <span class="letter">r</span><span class="letter">e</span><span class="letter">n</span><span class="letter">d</span><span class="letter">e</span><span class="letter">r</span>
                    </span>
                </h2>
            </a>
        </div>
    </section>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Animate hero elements on load
        gsap.from('.hero-title', {
            opacity: 0,
            y: 50,
            duration: 1,
            ease: 'power3.out'
        });

        gsap.from('.project-count', {
            opacity: 0,
            scale: 0.5,
            duration: 0.8,
            delay: 0.3,
            ease: 'back.out(1.7)'
        });

        gsap.from('.scroll-arrow', {
            opacity: 0,
            y: -20,
            duration: 0.8,
            delay: 0.5,
            ease: 'power2.out'
        });

        // Animate project cards on scroll
        gsap.utils.toArray('.project-card').forEach((card, index) => {
            gsap.from(card, {
                scrollTrigger: {
                    trigger: card,
                    start: 'top 80%',
                    end: 'top 50%',
                    toggleActions: 'play none none none'
                },
                opacity: 0,
                y: 60,
                duration: 0.8,
                delay: index * 0.2,
                ease: 'power3.out'
            });
        });

        // Smooth scroll for arrow
        document.querySelector('.scroll-arrow').addEventListener('click', () => {
            gsap.to(window, {
                scrollTo: '.projects-container',
                duration: 1,
                ease: 'power2.inOut'
            });
        });

        // Project filtering system
        const filterBtns = document.querySelectorAll('.filter-btn');
        const projectCards = document.querySelectorAll('.project-card');
        const projectCountEl = document.querySelector('.project-count');
        const allBtn = document.querySelector('[data-filter="all"]');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.dataset.filter;

                if (filter === 'all') {
                    // "All" button - deselect all others
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                } else {
                    // Category button - toggle active state
                    btn.classList.toggle('active');
                    // Deactivate "all" if any category is selected
                    allBtn.classList.remove('active');

                    // If no categories selected, activate "all"
                    const hasActiveCategories = Array.from(filterBtns)
                        .some(b => b.dataset.filter !== 'all' && b.classList.contains('active'));
                    if (!hasActiveCategories) {
                        allBtn.classList.add('active');
                    }
                }

                // Get all active filters (excluding "all")
                const activeFilters = Array.from(filterBtns)
                    .filter(b => b.classList.contains('active') && b.dataset.filter !== 'all')
                    .map(b => b.dataset.filter);

                // Filter projects
                let visibleCount = 0;
                projectCards.forEach(card => {
                    const categories = card.dataset.category;

                    // Show if "all" is active OR if card matches any active filter
                    if (allBtn.classList.contains('active') ||
                        activeFilters.some(filter => categories.includes(filter))) {
                        card.classList.remove('hidden');
                        visibleCount++;
                    } else {
                        card.classList.add('hidden');
                    }
                });

                // Update project count
                projectCountEl.textContent = visibleCount;
            });
        });
    </script>
</body>
</html>
