    <style>
        .scroll-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .sticky-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cards-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .card {
            position: absolute;
            border-radius: 24px;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
            overflow: hidden;
            cursor: pointer;
            box-shadow: none;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .card.hoverable:hover::after {
            opacity: 1;
        }


      


        .c1::after { background-image: url('knihobot_2.jpg'); background-position: right; }
        .c2::after { background-image: url('logcontrol_5.jpg'); }
        .c3::after { background-image: url('cyberrelax_cover.jpg'); }
        .c4::after { background-image: url('archviz_2.jpg'); background-position: center; }
        .c5::after { background-image: url('imrvere_4.jpg'); }
        .c6::after { background-image: url('gapcontrol_end.png'); }
        .c7::after { background-image: url('coffeeux_3.jpg'); }
        .c8::after { background-image: url('pension_2.jpg'); }
        .c9::after { background-image: url('iphone_cover_2.jpg'); }
        .c10::after { background-image: url('secretforest_2.jpg'); }
        .c11::after { background-image: url('pension_hover.jpg'); }

        /* Hero Text Overlay */
        .hero-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-53%, -50%);
            z-index: 50;
            pointer-events: none;
        }

        .hero-text-row {
            display: block;
            white-space: nowrap;
            will-change: transform;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            color: var(--text-color);
            line-height: 1.2;
        }

        /* Animated Button */
        .swirl-button {
            --duration: 7s;
            --easing: linear;
            --c-color-1: rgba(90, 88, 96, 0.6);
            --c-color-2: rgba(29, 29, 29, 0.7);
            --c-color-3: rgba(63, 63, 72, 0.6);
            --c-color-4: rgba(134, 134, 147, 0.5);
            --c-radial-inner: #2a2a2a;
            --c-radial-outer: #1a1a1a;
            --c-color: #fff;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            cursor: pointer;
            border: none;
            display: inline-flex;
            position: relative;
            border-radius: 28px;
            padding: 0;
            margin: 0;
            text-align: center;
            font-family: var(--font-family);
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.01em;
            line-height: 1.5;
            color: var(--c-color);
            background: var(--c-radial-outer);
            box-shadow: none;
            text-decoration: none;
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .swirl-button:before {
            content: "";
            pointer-events: none;
            position: absolute;
            z-index: 3;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            border-radius: 28px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .swirl-button .wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            min-width: 110px;
            padding: 10px 20px;
            background: radial-gradient(circle, var(--c-radial-inner), var(--c-radial-outer) 80%);
        }

        .swirl-button .wrapper span {
            display: inline-block;
            position: relative;
            letter-spacing: 3%;
            font-weight: 300;
            z-index: 1;
        }

        .swirl-button .wrapper .arrow {
            display: inline-block;
            margin-left: 8px;
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .swirl-button:hover {
            --duration: 2s;
            transform: translateY(-1px);
        }

        .swirl-button:hover .arrow {
            transform: translate(2px, 2px);
        }

        .swirl-button .wrapper .circle {
            position: absolute;
            left: 0;
            top: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            filter: blur(var(--blur, 8px));
            background: var(--background, transparent);
            transform: translate(var(--x, 0), var(--y, 0)) translateZ(0);
            animation: var(--animation, none) var(--duration) var(--easing) infinite;
        }

        .swirl-button .wrapper .circle.circle-1,
        .swirl-button .wrapper .circle.circle-9,
        .swirl-button .wrapper .circle.circle-10 {
            --background: var(--c-color-4);
        }

        .swirl-button .wrapper .circle.circle-3,
        .swirl-button .wrapper .circle.circle-4 {
            --background: var(--c-color-2);
            --blur: 14px;
        }

        .swirl-button .wrapper .circle.circle-5,
        .swirl-button .wrapper .circle.circle-6 {
            --background: var(--c-color-3);
            --blur: 16px;
        }

        .swirl-button .wrapper .circle.circle-2,
        .swirl-button .wrapper .circle.circle-7,
        .swirl-button .wrapper .circle.circle-8,
        .swirl-button .wrapper .circle.circle-11,
        .swirl-button .wrapper .circle.circle-12 {
            --background: var(--c-color-1);
            --blur: 12px;
        }

        .swirl-button .wrapper .circle.circle-1 { --x: 0; --y: -40px; --animation: circle-1; }
        .swirl-button .wrapper .circle.circle-2 { --x: 92px; --y: 8px; --animation: circle-2; }
        .swirl-button .wrapper .circle.circle-3 { --x: -12px; --y: -12px; --animation: circle-3; }
        .swirl-button .wrapper .circle.circle-4 { --x: 80px; --y: -12px; --animation: circle-4; }
        .swirl-button .wrapper .circle.circle-5 { --x: 12px; --y: -4px; --animation: circle-5; }
        .swirl-button .wrapper .circle.circle-6 { --x: 56px; --y: 16px; --animation: circle-6; }
        .swirl-button .wrapper .circle.circle-7 { --x: 8px; --y: 28px; --animation: circle-7; }
        .swirl-button .wrapper .circle.circle-8 { --x: 28px; --y: -4px; --animation: circle-8; }
        .swirl-button .wrapper .circle.circle-9 { --x: 20px; --y: -12px; --animation: circle-9; }
        .swirl-button .wrapper .circle.circle-10 { --x: 64px; --y: 16px; --animation: circle-10; }
        .swirl-button .wrapper .circle.circle-11 { --x: 4px; --y: 4px; --animation: circle-11; }
        .swirl-button .wrapper .circle.circle-12 { --blur: 14px; --x: 52px; --y: 4px; --animation: circle-12; }

        @keyframes circle-1 { 33% { transform: translate(0px, 16px) translateZ(0); } 66% { transform: translate(12px, 64px) translateZ(0); } }
        @keyframes circle-2 { 33% { transform: translate(80px, -10px) translateZ(0); } 66% { transform: translate(72px, -48px) translateZ(0); } }
        @keyframes circle-3 { 33% { transform: translate(20px, 12px) translateZ(0); } 66% { transform: translate(12px, 4px) translateZ(0); } }
        @keyframes circle-4 { 33% { transform: translate(76px, -12px) translateZ(0); } 66% { transform: translate(112px, -8px) translateZ(0); } }
        @keyframes circle-5 { 33% { transform: translate(84px, 28px) translateZ(0); } 66% { transform: translate(40px, -32px) translateZ(0); } }
        @keyframes circle-6 { 33% { transform: translate(28px, -16px) translateZ(0); } 66% { transform: translate(76px, -56px) translateZ(0); } }
        @keyframes circle-7 { 33% { transform: translate(8px, 28px) translateZ(0); } 66% { transform: translate(20px, -60px) translateZ(0); } }
        @keyframes circle-8 { 33% { transform: translate(32px, -4px) translateZ(0); } 66% { transform: translate(56px, -20px) translateZ(0); } }
        @keyframes circle-9 { 33% { transform: translate(20px, -12px) translateZ(0); } 66% { transform: translate(80px, -8px) translateZ(0); } }
        @keyframes circle-10 { 33% { transform: translate(68px, 20px) translateZ(0); } 66% { transform: translate(100px, 28px) translateZ(0); } }
        @keyframes circle-11 { 33% { transform: translate(4px, 4px) translateZ(0); } 66% { transform: translate(68px, 20px) translateZ(0); } }
        @keyframes circle-12 { 33% { transform: translate(56px, 0px) translateZ(0); } 66% { transform: translate(60px, -32px) translateZ(0); } }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const menuToggle = document.querySelector('.menu-toggle');
            const menuWrapper = document.querySelector('.menu-wrapper');

            menuToggle.addEventListener('click', function (e) {
                e.stopPropagation();
                menuWrapper.classList.toggle('active');
            });

            document.addEventListener('click', function (e) {
                if (!menuWrapper.contains(e.target)) {
                    menuWrapper.classList.remove('active');
                }
            });

            const menuLinks = document.querySelectorAll('.menu-dropdown a');
            menuLinks.forEach(link => {
                link.addEventListener('click', function () {
                    menuWrapper.classList.remove('active');
                });
            });
        });

    <script>
    gsap.registerPlugin(ScrollTrigger);

    // Initial card positions - stacked in center with slight rotations
    gsap.set(".card", {
        top: "50%",
        left: "50%",
        xPercent: -50,
        yPercent: -50,
        width: "250px",
        height: "320px"
    });

    gsap.set(".c1", { rotation: -3, zIndex: 7, opacity: 1 });
    gsap.set(".c2", { rotation: 2, zIndex: 8, opacity: 1 });
    gsap.set(".c3", { rotation: -1, zIndex: 6, opacity: 1 });
    gsap.set(".c4", { rotation: 4, zIndex: 5, opacity: 1 });
    gsap.set(".c5", { rotation: -2, zIndex: 4, opacity: 1 });
    gsap.set(".c6", { rotation: 1, zIndex: 3, opacity: 1 });
    gsap.set(".c7", { rotation: 2, zIndex: 2, opacity: 1 });
    gsap.set(".c8", { rotation: -1, zIndex: 1, opacity: 1 });
    gsap.set(".c9", { rotation: 3, zIndex: 1, opacity: 1 });
    gsap.set(".c10", { rotation: -2, zIndex: 1, opacity: 1 });
    gsap.set(".c11", { rotation: 1, zIndex: 1, opacity: 1 });

    // Hero text overlay - initial positions
    gsap.set(".hero-text-overlay", { opacity: 1 });
    gsap.set(".row-1", { x: 0 });
    gsap.set(".row-2", { x: 0 });

    // Single master timeline with labeled phases
    const master = gsap.timeline({ paused: true });

    // Phase 1: Scatter cards around the edges (hero text stays visible in center)
    master.addLabel("start", 0)
          // Cards scatter to edges - matching reference layout
          .to(".c1", { top: "8%", left: "-4%", width: "14%", height: "34%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .to(".c2", { top: "12%", left: "20%", width: "18%", height: "24%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .to(".c3", { top: "-8%", left: "48%", width: "16%", height: "36%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .to(".c4", { top: "20%", left: "74%", width: "18%", height: "24%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .to(".c5", { top: "52%", left: "10%", width: "18%", height: "36%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .to(".c6", { top: "70%", left: "34%", width: "24%", height: "28%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .to(".c7", { top: "64%", left: "66%", width: "16%", height: "34%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          // Edge cards - partially outside viewport
          .to(".c8", { top: "-22%", left: "12%", width: "20%", height: "24%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .to(".c9", { top: "75%", left: "-12%", width: "16%", height: "36%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .to(".c10", { top: "-18%", left: "82%", width: "26%", height: "28%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .to(".c11", { top: "54%", left: "88%", width: "24%", height: "30%", rotation: 0, opacity: 1, xPercent: 0, yPercent: 0, ease: "power2.inOut", duration: 1.2 }, 0)
          .addLabel("phase1", 1.2);

    // Track current phase for tweenTo
    let currentTarget = "start";

    // Single ScrollTrigger that triggers phase transitions
    ScrollTrigger.create({
        trigger: ".scroll-container",
        start: "top top",
        end: "+=200%",
        pin: true,
        anticipatePin: 1,
        markers: false,
        onUpdate: (self) => {
            const progress = self.progress;
            let newTarget;

            // Determine target based on scroll progress
            if (progress < 0.25) {
                newTarget = "start";
            } else {
                newTarget = "phase1";
            }

            // Only animate if target changed
            if (newTarget !== currentTarget) {
                currentTarget = newTarget;
                master.tweenTo(newTarget, { duration: 0.8, ease: "power2.inOut" });
            }
        }
    });

    // Refresh on load
    window.addEventListener('load', () => {
        ScrollTrigger.refresh();
    });

    // Card hover and click interactions
    const cards = document.querySelectorAll('.card');
    const cardsContainer = document.querySelector('.cards-container');

    // Mouse position tracking
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    // Move cards based on mouse position
    const maxMoveStacked = 70; // Max movement in stacked phase (per card)
    const maxMoveScattered = 200; // Max movement in scattered phase (container)

    // Parallax multipliers for stacked phase - higher z-index (top) = more movement
    const parallaxMultipliers = [0.85, 1, 0.75, 0.65, 0.55, 0.45, 0.35, 0.25, 0.25, 0.25, 0.25]; // c1-c11

    gsap.ticker.add(() => {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        // Calculate offset from center (normalized -1 to 1)
        const offsetX = (mouseX - centerX) / centerX;
        const offsetY = (mouseY - centerY) / centerY;

        if (currentTarget === 'start') {
            // Stacked phase: move individual cards with different amounts
            gsap.to(cardsContainer, { x: 0, y: 0, duration: 0.5, overwrite: 'auto' });

            cards.forEach((card, i) => {
                const multiplier = parallaxMultipliers[i];
                const deltaX = offsetX * maxMoveStacked * multiplier;
                const deltaY = offsetY * maxMoveStacked * multiplier;

                gsap.to(card, {
                    x: deltaX,
                    y: deltaY,
                    duration: 1.5,
                    ease: 'power3.out',
                    overwrite: 'auto'
                });
            });
        } else {
            // Scattered phase: move container opposite to mouse
            cards.forEach(card => {
                gsap.to(card, { x: 0, y: 0, duration: 0.5, overwrite: 'auto' });
            });

            const deltaX = -offsetX * maxMoveScattered;
            const deltaY = -offsetY * maxMoveScattered;

            gsap.to(cardsContainer, {
                x: deltaX,
                y: deltaY,
                duration: 1.5,
                ease: 'power3.out',
                overwrite: 'auto'
            });
        }
    });

    // Function to update hoverable state (for image swap on hover)
    function updateHoverableState() {
        cards.forEach(card => {
            if (currentTarget === 'phase1') {
                card.classList.add('hoverable');
            } else {
                card.classList.remove('hoverable');
            }
        });
    }

    // Watch for phase changes
    let lastTarget = currentTarget;
    setInterval(() => {
        if (lastTarget !== currentTarget) {
            lastTarget = currentTarget;
            updateHoverableState();
        }
    }, 100);

    // Click to navigate (only in phase 1)
    cards.forEach(card => {
        const url = card.dataset.url;
        card.addEventListener('click', () => {
            if (currentTarget === 'phase1' && url) {
                window.location.href = url;
            }
        });
    });

    // Hover scale effect for all cards using GSAP (to avoid CSS/GSAP transform conflicts)
    const originalZIndex = [7, 8, 6, 5, 4, 3, 2, 1, 1, 1, 1]; // c1-c11 original zIndex values

    cards.forEach((card, i) => {
        card.addEventListener('mouseenter', () => {
            if (currentTarget === 'phase1') {
                gsap.to(card, {
                    scale: 1.25,
                    zIndex: 100,
                    duration: 0.4,
                    ease: 'power2.out'
                });
            }
        });

        card.addEventListener('mouseleave', () => {
            gsap.to(card, {
                scale: 1,
                zIndex: originalZIndex[i],
                duration: 0.4,
                ease: 'power2.out'
            });
        });
    });
    </script>
</body>
</html>
